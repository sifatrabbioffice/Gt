name: Offline Website to Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 1. TOOLS ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xcodegen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      # ---------- 2. MIRROR WEBSITE (JS-aware) ----------
      - name: Install scraper
        run: |
          npm init -y >/dev/null
          npm install website-scraper website-scraper-puppeteer puppeteer --silent

      - name: Write scraper script
        run: |
          cat > scrape.js <<'EOF'
          const scrape = require('website-scraper');
          const PuppeteerPlugin = require('website-scraper-puppeteer');

          (async () => {
            try {
              const result = await scrape({
                urls: ['http://playgta5.com/'],
                directory: './webroot',
                recursive: true,
                maxRecursiveDepth: 5,
                maxDepth: 5,
                sources: [
                  { selector: 'img',        attr: 'src' },
                  { selector: 'img',        attr: 'srcset' },
                  { selector: 'link',       attr: 'href' },
                  { selector: 'script',     attr: 'src' },
                  { selector: 'source',     attr: 'src' },
                  { selector: 'source',     attr: 'srcset' },
                  { selector: 'video',      attr: 'src' },
                  { selector: 'video',      attr: 'poster' },
                  { selector: 'audio',      attr: 'src' },
                  { selector: 'a',          attr: 'href' },
                  { selector: 'iframe',     attr: 'src' },
                ],
                request: {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
                    'Accept-Language': 'en-US,en;q=0.9',
                  },
                },
                plugins: [
                  new PuppeteerPlugin({
                    launchOptions: {
                      headless: 'new',
                      args: ['--no-sandbox', '--disable-setuid-sandbox'],
                    },
                    scrollToBottom: { timeout: 20000, viewportN: 15 },
                    blockNavigation: false,
                  }),
                ],
              });
              console.log('Done. Files:', result.length);
            } catch (e) {
              console.error('Scrape failed:', e.message);
              process.exit(0); // don't kill workflow — fallback applies
            }
          })();
          EOF

      - name: Run scraper
        run: node scrape.js || true

      - name: Fallback (wget mirror) + flatten
        run: |
          set -e
          if [ ! -f webroot/index.html ] || [ "$(du -sk webroot | cut -f1)" -lt 100 ]; then
            echo "Scraper too small or missing index.html — trying wget..."
            rm -rf webroot
            mkdir -p webroot
            wget \
              --mirror \
              --page-requisites \
              --convert-links \
              --adjust-extension \
              --no-parent \
              --no-check-certificate \
              --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1" \
              --directory-prefix=webroot \
              https://playgat5.com/ || true
          fi

          # domain sub-folder flatten
          DOMAIN_DIR=$(find webroot -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -n "$DOMAIN_DIR" ] && [ "$DOMAIN_DIR" != "webroot" ]; then
            shopt -s dotglob
            mv "$DOMAIN_DIR"/* webroot/ 2>/dev/null || true
            shopt -u dotglob
            rmdir "$DOMAIN_DIR" 2>/dev/null || true
          fi

          # index.html নিশ্চিত করি
          if [ ! -f webroot/index.html ]; then
            FOUND=$(find webroot -iname 'index.html' | head -n 1)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              shopt -s dotglob
              mv "$DIR"/* webroot/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          if [ ! -f webroot/index.html ]; then
            echo "<html><body><h1>Offline copy (index.html missing)</h1></body></html>" > webroot/index.html
          fi

          # cleanup logs
          rm -f webroot/doit.log webroot/hts-log.txt 2>/dev/null || true

          echo "----- webroot size -----"
          du -sh webroot
          echo "----- top entries -----"
          find webroot -maxdepth 2 | head -80

      # ---------- 3. iOS PROJECT FILES ----------
      - name: Create Xcode project + Swift sources
        run: |
          mkdir -p Sources

          cat > project.yml <<'EOF'
          name: OfflineApp
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "14.0"
            objectVersion: 56
            xcodeVersion: "15.4"
            createIntermediateGroups: true
          targets:
            OfflineApp:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: webroot
                  type: folder
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: Offline
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIRequiresFullScreen: false
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.offlineapp
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

          cat > Sources/AppDelegate.swift <<'EOF'
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = WebViewController()
                  window.makeKeyAndVisible()
                  self.window = window
                  return true
              }
          }

          final class WebViewController: UIViewController {

              private var webView: WKWebView!

              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.allowsBackForwardNavigationGestures = true
                  self.webView = webView
                  self.view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  guard let indexURL = Self.findIndexHTML() else {
                      webView.loadHTMLString("<h1>index.html not found in bundle</h1>", baseURL: nil)
                      return
                  }
                  let root = indexURL.deletingLastPathComponent()
                  webView.loadFileURL(indexURL, allowingReadAccessTo: root)
              }

              static func findIndexHTML() -> URL? {
                  if let u = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "webroot") {
                      return u
                  }
                  if let u = Bundle.main.url(forResource: "index", withExtension: "html") {
                      return u
                  }
                  if let root = Bundle.main.resourceURL,
                     let en = FileManager.default.enumerator(at: root, includingPropertiesForKeys: nil) {
                      for case let f as URL in en {
                          if f.lastPathComponent.lowercased() == "index.html" {
                              return f
                          }
                      }
                  }
                  return nil
              }
          }
          EOF

      # ---------- 4. GENERATE + FORCE FORMAT 56 ----------
      - name: Generate Xcode project and force objectVersion 56
        run: |
          set -e
          xcodegen generate
          PBX="OfflineApp.xcodeproj/project.pbxproj"
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/g' "$PBX"
          sed -i '' -E 's/compatibilityVersion = "[^"]*";/compatibilityVersion = "Xcode 14.0";/g' "$PBX"
          echo "----- AFTER -----"
          grep -m3 -E "objectVersion|compatibilityVersion" "$PBX"

      # ---------- 5. BUILD ----------
      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project OfflineApp.xcodeproj \
            -scheme OfflineApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # ---------- 6. PACKAGE UNSIGNED IPA ----------
      - name: Package unsigned IPA
        run: |
          rm -rf Payload OfflineApp.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OfflineApp.app Payload/
          zip -qr OfflineApp.ipa Payload
          echo "IPA size:"
          ls -lh OfflineApp.ipa

      # ---------- 7. UPLOAD ----------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineApp-unsigned-ipa
          path: OfflineApp.ipa
          retention-days: 30
          compression-level: 0
