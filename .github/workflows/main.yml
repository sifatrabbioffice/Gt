name: Auto-Run Game and Build Offline IPA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Game URL'
        required: true
        default: 'https://playgta5.com/'
      capture_minutes:
        description: 'Minutes to auto-play and capture'
        required: true
        default: '30'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xcodegen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      # =========================================================
      # AUTO-RUN + FULL NETWORK CAPTURE
      # =========================================================
      - name: Install Puppeteer
        run: |
          npm init -y >/dev/null
          npm install puppeteer --silent

      - name: Write auto-run capture script
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://playgta5.com/' }}
          CAPTURE_MINUTES: ${{ github.event.inputs.capture_minutes || '30' }}
        run: |
          cat > capture.js <<'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const { URL } = require('url');

          const ROOT = './webroot';
          const TARGET = process.env.TARGET_URL || 'https://playgta5.com/';
          const MINUTES = parseInt(process.env.CAPTURE_MINUTES || '30', 10);
          const seen = new Set();
          let saved = 0, totalBytes = 0, failed = 0;

          function safePath(urlStr) {
            try {
              const u = new URL(urlStr);
              let p = decodeURIComponent(u.pathname);
              if (p === '' || p.endsWith('/')) p += 'index.html';
              // query → safe suffix
              if (u.search) {
                const q = u.search.replace(/[^a-zA-Z0-9]/g, '_').slice(0, 80);
                const ext = path.extname(p);
                p = ext ? p.replace(new RegExp(ext.replace('.', '\\.') + '$'), q + ext)
                        : p + q;
              }
              p = p.replace(/\.\.+/g, '_').replace(/\/+/g, '/');
              return path.join(ROOT, u.hostname, p);
            } catch { return null; }
          }

          function fmt(bytes) {
            if (bytes > 1024*1024*1024) return (bytes/1073741824).toFixed(2)+' GB';
            return (bytes/1048576).toFixed(1)+' MB';
          }

          (async () => {
            fs.mkdirSync(ROOT, { recursive: true });

            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox','--disable-setuid-sandbox',
                '--disable-web-security',
                '--enable-features=SharedArrayBuffer,WebAssemblySimd',
                '--js-flags=--max-old-space-size=8192',
                '--ignore-certificate-errors',
                '--autoplay-policy=no-user-gesture-required',
              ],
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.setUserAgent(
              'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) ' +
              'AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 ' +
              'Mobile/15E148 Safari/604.1'
            );

            // ---------- capture every response ----------
            page.on('response', async (resp) => {
              try {
                const url = resp.url();
                if (seen.has(url)) return;
                const st = resp.status();
                if (st < 200 || st >= 300) return;
                const ct = (resp.headers()['content-type'] || '').toLowerCase();
                if (ct.includes('event-stream')) return;

                seen.add(url);
                const fp = safePath(url);
                if (!fp) return;
                const buf = await resp.buffer().catch(() => null);
                if (!buf || buf.length === 0) return;

                fs.mkdirSync(path.dirname(fp), { recursive: true });
                fs.writeFileSync(fp, buf);
                saved++; totalBytes += buf.length;

                if (saved % 10 === 0) {
                  console.log(`[${saved}] ${fmt(totalBytes)}  ${url.slice(0,110)}`);
                }
              } catch {}
            });

            page.on('requestfailed', (req) => {
              failed++;
              if (failed % 20 === 0) console.log(`[FAILED ${failed}]`, req.url().slice(0,110));
            });

            // ---------- open page ----------
            console.log('Navigating:', TARGET);
            try {
              await page.goto(TARGET, { waitUntil: 'networkidle2', timeout: 180000 });
            } catch (e) { console.log('goto:', e.message); }

            // ---------- auto-click everything clickable ----------
            async function autoClickAll() {
              try {
                const clicked = await page.evaluate(() => {
                  const sels = [
                    'button','[role="button"]','a','canvas',
                    '.play','#play','.start','#start',
                    '[class*="play"]','[class*="start"]',
                    '[class*="enter"]','[class*="continue"]',
                    'input[type="submit"]','input[type="button"]',
                  ];
                  let n = 0;
                  for (const s of sels) {
                    for (const el of document.querySelectorAll(s)) {
                      try {
                        const r = el.getBoundingClientRect();
                        if (r.width < 5 || r.height < 5) continue;
                        el.click();
                        // also dispatch pointer events for canvas games
                        ['mousedown','mouseup','click','touchstart','touchend'].forEach(t => {
                          try {
                            const ev = t.startsWith('touch')
                              ? new TouchEvent(t, { bubbles: true })
                              : new MouseEvent(t, { bubbles: true,
                                  clientX: r.left + r.width/2,
                                  clientY: r.top + r.height/2 });
                            el.dispatchEvent(ev);
                          } catch {}
                        });
                        n++;
                      } catch {}
                    }
                  }
                  return n;
                });
                if (clicked > 0) console.log(`Auto-clicked ${clicked} elements`);
              } catch {}
            }

            // ---------- auto scroll + keypress to trigger lazy loads ----------
            async function autoInteract() {
              try {
                await page.evaluate(() => {
                  window.scrollBy(0, 1000);
                  window.dispatchEvent(new Event('resize'));
                  // dispatch common key events (Space, Enter, ArrowUp)
                  [32, 13, 38, 40, 37, 39].forEach(code => {
                    ['keydown','keyup'].forEach(type => {
                      try {
                        window.dispatchEvent(new KeyboardEvent(type, {
                          keyCode: code, which: code, bubbles: true,
                        }));
                        document.dispatchEvent(new KeyboardEvent(type, {
                          keyCode: code, which: code, bubbles: true,
                        }));
                      } catch {}
                    });
                  });
                });
              } catch {}
            }

            // ---------- periodic capture of performance resources ----------
            async function harvestPerformanceURLs() {
              try {
                return await page.evaluate(() =>
                  performance.getEntriesByType('resource').map(r => r.name)
                );
              } catch { return []; }
            }

            // ---------- main loop ----------
            const endTime = Date.now() + MINUTES * 60 * 1000;
            let tick = 0;
            let lastHarvestCount = 0;

            while (Date.now() < endTime) {
              tick++;
              await autoClickAll();
              await autoInteract();

              // every 30s, fetch URLs from performance API that we may have missed
              if (tick % 6 === 0) {
                const urls = await harvestPerformanceURLs();
                const newOnes = urls.filter(u => !seen.has(u));
                if (newOnes.length > 0 && newOnes.length !== lastHarvestCount) {
                  console.log(`Harvesting ${newOnes.length} missed URLs...`);
                  lastHarvestCount = newOnes.length;
                  for (const u of newOnes.slice(0, 200)) {
                    try {
                      const r = await page.evaluate(async (url) => {
                        const resp = await fetch(url, { credentials: 'include' });
                        if (!resp.ok) return null;
                        const b = await resp.arrayBuffer();
                        return Array.from(new Uint8Array(b));
                      }, u);
                      if (r) {
                        const fp = safePath(u);
                        fs.mkdirSync(path.dirname(fp), { recursive: true });
                        fs.writeFileSync(fp, Buffer.from(r));
                        seen.add(u);
                        saved++; totalBytes += r.length;
                      }
                    } catch {}
                  }
                }
              }

              const remain = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
              console.log(`[${tick}] ${saved} files, ${fmt(totalBytes)}, ${remain}s left`);
              await new Promise(r => setTimeout(r, 5000));
            }

            // ---------- final HTML ----------
            try {
              const html = await page.content();
              const host = new URL(TARGET).hostname;
              const hp = path.join(ROOT, host, 'index.html');
              fs.mkdirSync(path.dirname(hp), { recursive: true });
              fs.writeFileSync(hp, html);
            } catch {}

            await browser.close();

            fs.writeFileSync('capture-stats.json',
              JSON.stringify({ saved, totalBytes, failed, urls: seen.size }, null, 2));

            console.log('=========================================');
            console.log('DONE:', saved, 'files,', fmt(totalBytes));
            console.log('Failed:', failed, '| Unique URLs:', seen.size);
            console.log('=========================================');
          })();
          EOF

      - name: Run auto capture
        run: node capture.js || true

      - name: Show capture stats
        run: |
          echo "===== stats ====="
          cat capture-stats.json || true
          echo "===== webroot size ====="
          du -sh webroot || true
          echo "===== top dirs ====="
          find webroot -maxdepth 2 -type d | head -40

      # ---------- flatten ----------
      - name: Flatten webroot
        run: |
          set -e
          HOST=$(echo "${{ github.event.inputs.target_url || 'https://playgta5.com/' }}" | sed -E 's#https?://##; s#/.*##')
          echo "Host: $HOST"
          if [ -d "webroot/$HOST" ]; then
            shopt -s dotglob
            mv webroot/$HOST/* webroot/ 2>/dev/null || true
            shopt -u dotglob
            rmdir webroot/$HOST 2>/dev/null || true
          fi

          if [ ! -f webroot/index.html ]; then
            FOUND=$(find webroot -iname 'index.html' | head -n 1)
            [ -n "$FOUND" ] && {
              DIR=$(dirname "$FOUND")
              shopt -s dotglob
              mv "$DIR"/* webroot/ 2>/dev/null || true
              shopt -u dotglob
            }
          fi

          [ ! -f webroot/index.html ] && echo "<html><body><h1>Offline copy</h1></body></html>" > webroot/index.html
          echo "----- final -----"
          du -sh webroot
          find webroot -maxdepth 2 | head -80

      # =========================================================
      # iOS PROJECT
      # =========================================================
      - name: Create Xcode project + Swift sources
        run: |
          mkdir -p Sources

          cat > project.yml <<'EOF'
          name: OfflineApp
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "14.0"
            objectVersion: 56
            xcodeVersion: "15.4"
            createIntermediateGroups: true
          targets:
            OfflineApp:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: webroot
                  type: folder
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: Offline
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIRequiresFullScreen: false
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.offlineapp
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

          cat > Sources/AppDelegate.swift <<'EOF'
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = WebViewController()
                  window.makeKeyAndVisible()
                  self.window = window
                  return true
              }
          }

          final class WebViewController: UIViewController {
              private var webView: WKWebView!

              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  if #available(iOS 14.0, *) {
                      config.defaultWebpagePreferences.allowsContentJavaScript = true
                  }
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.allowsBackForwardNavigationGestures = true
                  self.webView = webView
                  self.view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  guard let url = Self.findIndexHTML() else {
                      webView.loadHTMLString("<h1>index.html not found</h1>", baseURL: nil)
                      return
                  }
                  webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
              }

              static func findIndexHTML() -> URL? {
                  if let u = Bundle.main.url(forResource: "index", withExtension: "html",
                                             subdirectory: "webroot") { return u }
                  if let u = Bundle.main.url(forResource: "index", withExtension: "html") { return u }
                  if let root = Bundle.main.resourceURL,
                     let en = FileManager.default.enumerator(at: root, includingPropertiesForKeys: nil) {
                      for case let f as URL in en where f.lastPathComponent.lowercased() == "index.html" {
                          return f
                      }
                  }
                  return nil
              }
          }
          EOF

      - name: Generate Xcode project + force objectVersion 56
        run: |
          set -e
          xcodegen generate
          PBX="OfflineApp.xcodeproj/project.pbxproj"
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/g' "$PBX"
          sed -i '' -E 's/compatibilityVersion = "[^"]*";/compatibilityVersion = "Xcode 14.0";/g' "$PBX"
          grep -m3 -E "objectVersion|compatibilityVersion" "$PBX"

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project OfflineApp.xcodeproj \
            -scheme OfflineApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload OfflineApp.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OfflineApp.app Payload/
          zip -qr OfflineApp.ipa Payload
          ls -lh OfflineApp.ipa

      # ---------- upload (chunked to bypass 10GB limit) ----------
      - name: Split webroot if larger than 8 GB
        run: |
          SIZE=$(du -sm webroot | cut -f1)
          echo "webroot size: ${SIZE} MB"
          if [ "$SIZE" -gt 8000 ]; then
            echo "Splitting into 2 GB chunks..."
            mkdir -p chunks
            tar -cf - webroot | split -b 2000m - chunks/webroot.part_
            ls -lh chunks/
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OfflineApp-unsigned-ipa
          path: OfflineApp.ipa
          retention-days: 30
          compression-level: 0

      - name: Upload webroot (small case)
        if: hashFiles('chunks/*') == ''
        uses: actions/upload-artifact@v4
        with:
          name: webroot-captured
          path: webroot/
          retention-days: 7
          compression-level: 6

      - name: Upload webroot chunks (large case)
        if: hashFiles('chunks/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: webroot-chunks
          path: chunks/
          retention-days: 7
          compression-level: 0

      - name: Upload capture stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-stats
          path: capture-stats.json
          retention-days: 7
